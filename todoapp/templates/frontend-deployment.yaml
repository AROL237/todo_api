apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-app
          image: "{{.Values.frontend.image.repository}}:{{.Values.frontend.image.tag}}"
          pullPolicy: {{.Values.frontend.image.pullPolicy}}
          envFrom:
            - configMapRef:
                name: front-app-config
          ports:
            - name: frontend
              containerPort: {{ .Values.frontend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - name: frontend
      port: {{ .Values.frontend.port }}
      targetPort: frontend
